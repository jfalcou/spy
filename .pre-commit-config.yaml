exclude: |
    (?x)^(
        ^test_package/.*|
        ^doc/.*
    )

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v22.1.8
  hooks:
  - id: clang-format
    types_or: [c++]
