# CPM is vendored upstream code, in both copies, and our style has no business rewriting it
exclude: |
    (?x)^(
        ^doc/.*|
        ^cmake/CPM\.cmake$|
        ^test/integration/cpm-test/cpm\.cmake$
    )

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v23.1.3
  hooks:
  - id: clang-format
    types_or: [c++]
- repo: https://github.com/cheshirekow/cmake-format-precommit
  rev: v0.6.13
  hooks:
  - id: cmake-format
  - id: cmake-lint
