    A reader for the CSV that clang's -fproc-stat-report leaves behind, attached to every run of the
    compile cost workflow. Everything happens in the browser: the file is read locally and never
    leaves the machine, so a measurement can be opened from a laptop with no network at all.

    copa_setup_doxygen configures this file, the project's name going where spy is, and
    publishes it beside the documentation. The theme variables are copied from doxygen-awesome.css
    rather than linked, so the page survives being saved and opened on its own; served beside the
    documentation, color.css overrides them with the project's own colours.
==================================================================================================-->

<main>
  <header>

<script>
"use strict";
(() => {

// ---- reading -----------------------------------------------------------------------------------
// clang writes, with no header: "program","output",total_us,user_us,peak_rss_kb

// The source a CMake object path came from. Objects live in
// <build>/test/unit/CMakeFiles/<target>.dir/<path>.o, so everything before the .dir/ is build
// layout and everything after it is what a reader recognises. A multi-config generator adds the
// configuration after the .dir/, which compile_cost.py strips as well, so both name the same modules.
const CONFIGS = /^(Debug|Release|RelWithDebInfo|MinSizeRel)[/]/;

function unitOf(output) {
  const i = output.indexOf(".dir/");
  const name = i >= 0 ? output.slice(i + 5).replace(CONFIGS, "") : output.slice(output.lastIndexOf("/") + 1);
  return name.slice(-2) === ".o" ? name.slice(0, -2) : name;
}

function moduleOf(unit) {
  const p = unit.split("/");
  if (p.length > 2) return `${p[0]}/${p[1]}`;
  return p.length > 1 ? p[0] : "top level";
}

// A quoted field may itself hold a comma, so the split has to know about the quotes.
function splitRow(line) {
  const out = [];
  let cur = "";
  let quoted = false;

  for (const c of line) {
    if (c === '"') { quoted = !quoted; continue; }
    if (c === "," && !quoted) { out.push(cur); cur = ""; continue; }
    cur += c;
  }

  out.push(cur);
  return out;
}

// The first column is the program the driver spawned, so a line whose program is not the compiler is
// the linker's: an executable, not a unit, and a figure that belongs in neither total.
function parse(text) {
  const rows = [], links = [], seen = Object.create(null), linked = Object.create(null);
  for (const line of text.split(/\r?\n/)) {
    if (!line) continue;
    const f = splitRow(line);
    if (f.length !== 5) continue;
    const rss = parseInt(f[4], 10), cpu = parseInt(f[3], 10);
    if (!isFinite(rss) || !isFinite(cpu)) continue;
    if (!f[0].includes("clang")) {
      const exe = f[1].split("/").pop();
      linked[exe] = { unit: exe, rss, cpu };
      continue;
    }
    const unit = unitOf(f[1]);
    seen[unit] = { unit, module: moduleOf(unit), rss, cpu };
  }
  for (const k in seen) rows.push(seen[k]);
  for (const e in linked) links.push(linked[e]);
  return { rows, links };
}

// ---- formatting --------------------------------------------------------------------------------
function size(kib) {
  return kib < 1024 * 1024 ? `${(kib / 1024).toFixed(0)} MiB`
                           : `${(kib / 1048576).toFixed(2)} GiB`;
}
// Tenths of a second under a minute, then hours, minutes and seconds, a part written only when it
// is not zero: "4 min 12 s", "1 h 14 min", "3 h 49 s". Rounding the seconds can carry upwards.
function duration(usec) {
  const s = usec / 1e6;
  if (s < 59.95) return `${s.toFixed(1)} s`;
  let h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = Math.round(s % 60);
  if (r === 60) { r = 0; m += 1; }
  if (m === 60) { m = 0; h += 1; }
  const parts = [];
  if (h) parts.push(`${h} h`);
  if (m) parts.push(`${m} min`);
  if (r) parts.push(`${r} s`);
  return parts.join(" ");
}
function plural(n, word) { return `${n} ${word}${n === 1 ? "" : "s"}`; }
function quantile(sorted, q) {           // nearest-rank, as the report generator does it
  return sorted[Math.min(sorted.length - 1, Math.floor(q * sorted.length))];
}
// A peak moves by a few percent between two runs of the same code on a shared runner, so a change counts only
// past both bounds: a share of the peak, and an amount a machine notices.
const NOISE_RATIO = 0.05, NOISE_KIB = 16 * 1024;

function significant(now, before) {
  return Math.abs(now - before) > before * NOISE_RATIO && Math.abs(now - before) > NOISE_KIB;
}

function pct(now, before) {
  if (before === undefined) return { text: "new", cls: "" };
  if (before === 0) return { text: "n/a", cls: "" };
  if (!significant(now, before)) return { text: "noise", cls: "noise" };
  const p = 100 * (now - before) / before;
  return { text: `${p > 0 ? "+" : ""}${p.toFixed(0)} %`, cls: p > 0 ? "up" : "down" };
}

// Modules are ranked, so they take an ordered palette rather than one hue apiece: inferno, sampled
// at thirty-two stops from matplotlib, reads in order for everyone, colour vision aside, and prints
// in grey. The heaviest module takes the hot end. The ends themselves are left out, black on the dark
// theme and pale yellow on the light one being the two colours a page cannot show a dot in.
const INFERNO = ["#000004","#040312","#0B0724","#150B37","#230C4C","#310A5C","#3E0966","#4C0C6B","#5A116E","#67166E","#741A6E","#801F6C","#8F2469","#9B2964","#A82E5F","#B43359","#C13A50","#CC4248","#D74B3F","#E05536","#E9612B","#EF6E21","#F57B17","#F8890C","#FB9906","#FCA80D","#FBB81D","#F9C72F","#F5D949","#F2E865","#F3F586","#FCFFA4"];

function inferno(t) {
  const x = Math.min(1, Math.max(0, t)) * (INFERNO.length - 1);
  const i = Math.floor(x), f = x - i;
  if (i >= INFERNO.length - 1) return INFERNO[INFERNO.length - 1];
  const a = INFERNO[i];
  const b = INFERNO[i + 1];
  let out = "#";
  for (let k = 1; k < 7; k += 2) {
    const v = Math.round(parseInt(a.substr(k, 2), 16) * (1 - f) + parseInt(b.substr(k, 2), 16) * f);
    out += (v < 16 ? "0" : "") + v.toString(16);
  }
  return out;
}

function darkTheme() {
  const root = document.documentElement;
  return root.classList.contains("dark-mode") ||
         (window.matchMedia("(prefers-color-scheme: dark)").matches && !root.classList.contains("light-mode"));
}

// Rank i of n modules, the heaviest first, spread over the readable part of the ramp for the theme.
function moduleColor(i, n) {
  const lo = darkTheme() ? 0.35 : 0.12, hi = darkTheme() ? 0.95 : 0.82;
  const t = n > 1 ? 1 - i / (n - 1) : 1;
  return inferno(lo + (hi - lo) * t);
}

// ---- state -------------------------------------------------------------------------------------
const state = { rows: [], links: [], base: null, linkBase: null, sort: { key: "rss", dir: -1 },
              q: "", mod: "", colors: {}, series: [], picked: [] };
const SVGNS = "http://www.w3.org/2000/svg";

function el(name, attrs, text) {
  const n = document.createElementNS(SVGNS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text !== undefined) n.textContent = text;
  return n;
}

const tip = document.getElementById("tip");
function showTip(evt, html) {
  tip.innerHTML = html;
  tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  const x = Math.min(evt.clientX + 14, window.innerWidth - r.width - 8);
  const y = Math.max(8, evt.clientY - r.height - 12);
  tip.style.left = `${x}px`;
  tip.style.top = `${y}px`;
}
function hideTip() { tip.style.display = "none"; }

function attachTip(node, html) {
  node.addEventListener("mousemove", e => { showTip(e, html); });
  node.addEventListener("mouseleave", hideTip);
}

// ---- the facts ---------------------------------------------------------------------------------
function renderFacts() {
  const rows = state.rows;
  const peaks = rows.map(r => r.rss).sort((a, b) => a - b);
  const totalCpu = rows.reduce((a, r) => a + r.cpu, 0);
  const worst = rows.reduce((a, r) => r.rss > a.rss ? r : a, rows[0]);

  const mods = groupByModule(rows);
  const top = mods[0];

  const out = [];
  out.push(`<b>${rows.length} translation units</b>, ${duration(totalCpu)} of CPU in all.`);
  out.push(`The heaviest one is <span class="mono">${esc(worst.unit)}</span>, peaking at <b>${size(worst.rss)}</b> over ${duration(worst.cpu)}.`);
  out.push(`Half of them peak under ${size(quantile(peaks, 0.5))}, a tenth above ${size(quantile(peaks, 0.9))}.`);
  out.push(`<span class="mono">${esc(top.module)}</span> carries ${duration(top.cpu)} of that CPU on its own, ${(100 * top.cpu / totalCpu).toFixed(0)} % of the build, over ${top.units.length} units.`);

  if (state.links.length) {
    const linkCpu = state.links.reduce((a, r) => a + r.cpu, 0);
    const worstLink = state.links.reduce((a, r) => r.rss > a.rss ? r : a, state.links[0]);
    out.push(`<b>${plural(state.links.length, "link")}</b>, ${duration(linkCpu)} of CPU, the heaviest <span class="mono">${esc(worstLink.unit)}</span> peaking at ${size(worstLink.rss)}.`);
  }

  if (state.base) {
    const grew = rows.filter(r => {
      const b = state.base[r.unit];
      return b !== undefined && r.rss > b && significant(r.rss, b);
    });
    out.push(grew.length
      ? `<b>${plural(grew.length, "unit")} grew</b> by more than 5 % and 16 MiB against the baseline.`
      : "Nothing grew by more than 5 % and 16 MiB against the baseline.");
  }

  const ul = document.getElementById("facts");
  ul.innerHTML = "";
  out.forEach(h => {
    const li = document.createElement("li");
    li.innerHTML = h;
    ul.appendChild(li);
  });
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function groupByModule(rows) {
  const by = {};
  rows.forEach(r => {
    const g = by[r.module] || (by[r.module] = { module: r.module, cpu: 0, units: [] });
    g.cpu += r.cpu;
    g.units.push(r);
  });
  const list = Object.values(by);
  list.sort((a, b) => b.cpu - a.cpu);
  list.forEach(g => { g.units.sort((a, b) => b.rss - a.rss); });
  return list;
}

// ---- charts ------------------------------------------------------------------------------------
function clear(svg) { while (svg.firstChild) svg.removeChild(svg.firstChild); }

// The drawing every chart over time or memory shares, in viewBox units: the left margin varies with the width
// of the labels the vertical axis carries, the rest does not.
const W = 1080, H = 380, R = 12, T = 16, B = 38;

function yOf(v, hi) { return T + (H - T - B) * (1 - v / hi); }

// The vertical scale: the top on a whole step, and one gridline per step from zero.
function scale(top, step) {
  const hi = Math.max(step, Math.ceil(top / step) * step), values = [];
  for (let v = 0; v <= hi + step / 2; v += step) values.push(v);
  return { hi, values };
}

// What a chart draws around its marks: a gridline and a label per step of its scale, the horizontal axis, the
// labels of its two ends, and its title.
function frame(svg, o) {
  o.scale.values.forEach(v => {
    const y = yOf(v, o.scale.hi);
    svg.appendChild(el("line", { class: "grid", x1: o.left, y1: y, x2: W - R, y2: y }));
    svg.appendChild(el("text", { x: o.left - 6, y: y + 4, "text-anchor": "end" }, o.write(v)));
  });
  svg.appendChild(el("line", { class: "axis", x1: o.left, y1: H - B, x2: W - R, y2: H - B }));
  svg.appendChild(el("text", { x: o.left, y: H - B + 16 }, o.from));
  svg.appendChild(el("text", { x: W - R, y: H - B + 16, "text-anchor": "end" }, o.to));
  if (o.title) svg.appendChild(el("text", { x: (o.left + W - R) / 2, y: H - 4, "text-anchor": "middle" }, o.title));
}

function histogram() {
  const svg = document.getElementById("hist");
  clear(svg);
  const L = 54;
  const peaks = state.rows.map(r => r.rss).sort((a, b) => a - b);
  const max = peaks[peaks.length - 1], bins = 48, counts = new Array(bins).fill(0);
  // From the lowest peak rounded down to a step rather than from zero: units of one suite peak close to each
  // other, and an axis from zero packs them all into its last bins.
  const step = axisStep("peak_kib", Math.max(1, max - peaks[0]) / 4);
  const min = Math.floor(peaks[0] / step) * step, span = Math.max(1, max - min);
  const bin = v => Math.min(bins - 1, Math.floor((v - min) / span * bins));
  peaks.forEach(v => { counts[bin(v)]++; });
  const top = Math.max(...counts), sc = scale(top, Math.max(1, niceStep(top / 4)));

  frame(svg, { left: L, scale: sc, write: String, from: size(min), to: size(max), title: "peak resident memory" });

  const bw = (W - L - R) / bins;
  counts.forEach((c, i) => {
    if (!c) return;
    const h = (H - T - B) * c / sc.hi;
    const rect = el("rect", { class: "bar", x: L + i * bw + 0.5, y: H - B - h,
                            width: Math.max(1, bw - 1), height: h, rx: 1 });
    attachTip(rect, `<b>${plural(c, "unit")}</b><br/>between ${size(min + span * i / bins)} and ${size(min + span * (i + 1) / bins)}`);
    svg.appendChild(rect);
  });

  [[0.5, "median"], [0.9, "ninth decile"]].forEach(m => {
    const x = L + (W - L - R) * (quantile(peaks, m[0]) - min) / span;
    svg.appendChild(el("line", { class: "mark", x1: x, y1: T, x2: x, y2: H - B }));
    svg.appendChild(el("text", { x: x + 4, y: T + 10 }, m[1]));
  });
}

function scatter() {
  const svg = document.getElementById("scatter");
  clear(svg);
  const L = 74;
  let maxRss = 0, maxCpu = 0;
  state.rows.forEach(r => {
    if (r.rss > maxRss) maxRss = r.rss;
    if (r.cpu > maxCpu) maxCpu = r.cpu;
  });
  const sc = scale(maxRss, axisStep("peak_kib", maxRss / 4));

  frame(svg, { left: L, scale: sc, write: size, from: "0", to: duration(maxCpu), title: "CPU time" });

  state.rows.forEach(r => {
    const x = L + (W - L - R) * (r.cpu / maxCpu);
    const y = yOf(r.rss, sc.hi);
    // A style, since the fill of the .dot rule would win over an attribute.
    const c = el("circle", { class: "dot", cx: x, cy: y, r: 3.4, style: `fill: ${state.colors[r.module]}` });
    attachTip(c, `<span class="mono">${esc(r.unit)}</span>${size(r.rss)} &middot; ${duration(r.cpu)}`);
    svg.appendChild(c);
  });
}

// One bar per module, ranked either by the CPU it adds up to or by the heaviest unit it holds. The
// second is deliberately not a sum: peaks belong to processes that never run at the same time, and
// what a module costs in memory is the one unit a machine has to fit.
function moduleBars(id, metric) {
  const svg = document.getElementById(id);
  clear(svg);
  const list = groupByModule(state.rows).slice();
  const value = metric === "cpu" ? g => g.cpu : g => g.units[0].rss;
  list.sort((a, b) => value(b) - value(a));

  const W = 1080, L = 150, R = 110, T = 6, rowH = 20;
  const H = T + list.length * rowH + 24;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  const max = value(list[0]);
  list.forEach((g, i) => {
    const y = T + i * rowH;
    const w = (W - L - R) * value(g) / max;

    const label = el("text", { x: L - 8, y: y + 13, "text-anchor": "end",
                             fill: "var(--page-foreground-color)" }, g.module);
    svg.appendChild(label);

    const rect = el("rect", { class: "modbar", x: L, y: y + 3, width: Math.max(1, w),
                            height: rowH - 7, rx: 2, fill: state.colors[g.module] });
    rect.addEventListener("click", () => {
      document.getElementById("mod").value = state.mod === g.module ? "" : g.module;
      state.mod = document.getElementById("mod").value;
      renderTable();
      showTab("tab-units");
    });
    attachTip(rect, `<b>${esc(g.module)}</b><br/>${g.units.length} units &middot; ${duration(g.cpu)} of CPU<br/>heaviest ${size(g.units[0].rss)} in <span class="mono">${esc(g.units[0].unit)}</span>`);
    svg.appendChild(rect);

    svg.appendChild(el("text", { x: L + w + 8, y: y + 13 },
                       metric === "cpu" ? `${duration(g.cpu)}  ·  ${g.units.length} units`
                                        : `${size(g.units[0].rss)}  ·  ${g.units.length} units`));
  });
}

// ---- table -------------------------------------------------------------------------------------
const COLS = [
  { key: "unit",   label: "Translation unit", num: false },
  { key: "module", label: "Module",           num: false },
  { key: "rss",    label: "Peak RSS",         num: true  },
  { key: "cpu",    label: "CPU",              num: true  }
];

function visible() {
  const q = state.q.toLowerCase();
  const rows = state.rows.filter(r => {
    if (state.mod && r.module !== state.mod) return false;
    return !q || r.unit.toLowerCase().includes(q);
  });
  const k = state.sort.key, d = state.sort.dir;
  rows.sort((a, b) => {
    if (k === "delta") {
      const da = delta(a), db = delta(b);
      return (da - db) * d;
    }
    const va = a[k], vb = b[k];
    if (typeof va === "string") return va.localeCompare(vb) * d;
    return (va - vb) * d;
  });
  return rows;
}

function delta(r) {
  if (!state.base) return 0;
  const b = state.base[r.unit];
  return b === undefined || b === 0 || !significant(r.rss, b) ? 0 : (r.rss - b) / b;
}

function cell(tr, text, cls) {
  const td = document.createElement("td");
  td.textContent = text;
  if (cls) td.className = cls;
  tr.appendChild(td);
  return td;
}

function headCell(tr, label, num) {
  const th = document.createElement("th");
  th.textContent = label;
  if (num) th.className = "num";
  tr.appendChild(th);
  return th;
}

function renderHead() {
  const tr = document.getElementById("head");
  tr.innerHTML = "";
  tr.appendChild(document.createElement("th")).className = "swatch-cell";
  const cols = COLS.slice();
  if (state.base) cols.push({ key: "delta", label: "\u0394 RSS", num: true });
  cols.forEach(c => {
    const th = headCell(tr, c.label, c.num);
    if (state.sort.key === c.key) th.setAttribute("aria-sort", state.sort.dir < 0 ? "descending" : "ascending");
    th.addEventListener("click", () => {
      if (state.sort.key === c.key) state.sort.dir = -state.sort.dir;
      else state.sort = { key: c.key, dir: c.num ? -1 : 1 };
      renderHead();
      renderTable();
    });
  });
}

function renderTable() {
  const rows = visible();
  const body = document.getElementById("body");
  body.innerHTML = "";
  const frag = document.createDocumentFragment();

  rows.forEach(r => {
    const tr = document.createElement("tr");
    const dot = document.createElement("span");
    dot.className = "swatch";
    dot.style.background = state.colors[r.module];
    cell(tr, "", "swatch-cell").appendChild(dot);
    cell(tr, r.unit, "unit");
    cell(tr, r.module);
    measures(tr, r, state.base);
    frag.appendChild(tr);
  });

  body.appendChild(frag);
  document.getElementById("count").textContent =
    `${rows.length} of ${state.rows.length} units shown`;
}

// The peak, the CPU, and against a baseline the change of the peak: the columns a unit and a link share.
function measures(tr, r, base) {
  cell(tr, size(r.rss), "num");
  cell(tr, duration(r.cpu), "num");
  if (!base) return;
  const p = pct(r.rss, base[r.unit]);
  cell(tr, p.text, p.cls ? `num ${p.cls}` : "num");
}

function renderModuleFilter() {
  const sel = document.getElementById("mod");
  const keep = sel.value;
  sel.innerHTML = "<option value=\"\">All modules</option>";
  groupByModule(state.rows).forEach(g => {
    const o = document.createElement("option");
    o.value = g.module;
    o.textContent = `${g.module}  (${g.units.length})`;
    sel.appendChild(o);
  });
  sel.value = keep;
}

function peaksByUnit(list) {
  const by = {};
  list.forEach(r => { by[r.unit] = r.rss; });
  return by;
}

// A measurement goes into one of the two slots, read from a file or from the series alike: the one shown, or
// the baseline its deltas are taken against.
function apply(read, which, label) {
  if (which === "now") {
    state.rows = read.rows;
    state.links = read.links;
  } else {
    state.base = peaksByUnit(read.rows);
    state.linkBase = peaksByUnit(read.links);
  }
  document.getElementById(`slot-${which}`).classList.add("filled");
  document.getElementById(`name-${which}`).textContent =
    `${label} \u2014 ${read.rows.length} units, ${read.links.length} links`;
  renderAll();
}

function renderAll() {
  if (!state.rows.length) return;
  const groups = groupByModule(state.rows);
  groups.forEach((g, i) => { state.colors[g.module] = moduleColor(i, groups.length); });
  document.getElementById("empty").hidden = true;
  document.getElementById("report").hidden = false;
  MEASURED_TABS.forEach(id => { document.getElementById(id).hidden = false; });
  renderFacts();
  histogram();
  scatter();
  moduleBars("modules-cpu", "cpu");
  moduleBars("modules-rss", "rss");
  renderModuleFilter();
  renderHead();
  renderTable();
  renderLinks();
  if (state.series.length) drawSeries();
}

// ---- linking ------------------------------------------------------------------------------------
// One row per executable, heaviest first: an executable is not a unit, so it has no module and its
// figures stay out of every total above.
function renderLinks() {
  const head = document.getElementById("link-head"), body = document.getElementById("link-body");
  head.innerHTML = "";
  body.innerHTML = "";
  document.getElementById("tab-links").hidden = !state.links.length;
  if (!state.links.length) return;

  const cols = ["Executable", "Peak RSS", "CPU"];
  if (state.linkBase) cols.push("\u0394 RSS");
  cols.forEach((label, i) => { headCell(head, label, i > 0); });

  state.links.slice().sort((a, b) => b.rss - a.rss).forEach(r => {
    const tr = document.createElement("tr");
    cell(tr, r.unit, "mono");
    measures(tr, r, state.linkBase);
    body.appendChild(tr);
  });
}

// ---- the series ---------------------------------------------------------------------------------
// Every measurement of a push lands on the ct-measures branch, one CSV named by its commit and one
// index holding what a curve needs. The index is read raw, which needs no token on a public
// repository, and a CSV is only fetched for a commit someone asks to read.
const SERIES = "https://raw.githubusercontent.com/jfalcou/spy/ct-measures";

function seriesUrl(name) { return `${SERIES}/${name}`; }

function loadSeries() {
  if (!SERIES || SERIES.startsWith("@")) return;
  fetch(seriesUrl("index.json")).then(r => r.ok ? r.json() : null).then(index => {
    if (!index || !index.length) return;
    state.series = index;
    document.getElementById("tab-history").hidden = false;
    fillSeriesControls();
    drawSeries();
    if (!state.rows.length) openOnLatest();
  }).catch(() => { /* no series published yet, and the tab stays hidden */ });
}

// Without a measurement loaded, every other tab has nothing to draw: the page opens on the curve, and the rest
// comes back the moment a point is clicked or a file is dropped.
const MEASURED_TABS = ["tab-hist", "tab-scatter", "tab-modules-cpu", "tab-modules-rss", "tab-links", "tab-units"];

function openOnSeries() {
  MEASURED_TABS.forEach(id => { document.getElementById(id).hidden = true; });
  document.getElementById("empty").hidden = true;
  document.getElementById("empty-series").hidden = false;
  document.getElementById("report").hidden = false;
  showTab("tab-history");
}

// Opened from the published site with no file chosen, the page reads the last measurement of the branch the curve
// shows. The curve stays the fallback when that CSV is gone from the branch.
function openOnLatest() {
  openOnSeries();
  const shown = seriesShown();
  if (shown.length) pick(shown[shown.length - 1], true);
}

function seriesShown() {
  const branch = document.getElementById("hist-branch").value;
  return state.series.filter(e => !branch || e.branch === branch);
}

// The total grows with every unit a commit adds, so a curve of it reads a new test as a regression. Divided by
// the units the same measurement counts, it follows what one unit costs.
function seriesValue(entry, scope, metric) {
  const from = scope === "" ? entry : entry.modules && entry.modules[scope];
  if (!from) return undefined;
  if (metric === "cpu_per_unit") return from.units ? from.cpu_us / from.units : undefined;
  return from[metric];
}

// Hundredths of a second, which the mean of a unit needs where a total reads in tenths.
function unitDuration(usec) {
  return usec < 9.995e6 ? `${(usec / 1e6).toFixed(2)} s` : duration(usec);
}

function fillSeriesControls() {
  const branches = [], scopes = [];
  state.series.forEach(e => {
    if (e.branch && !branches.includes(e.branch)) branches.push(e.branch);
    for (const m in (e.modules || {})) if (!scopes.includes(m)) scopes.push(m);
  });
  branches.sort();
  scopes.sort();

  const b = document.getElementById("hist-branch");
  b.innerHTML = "";
  branches.forEach(name => {
    const o = document.createElement("option");
    o.value = name;
    o.textContent = name;
    b.appendChild(o);
  });
  if (branches.includes("main")) b.value = "main";

  const sc = document.getElementById("hist-scope");
  sc.innerHTML = '<option value="">The whole build</option>';
  scopes.forEach(name => {
    const o = document.createElement("option");
    o.value = name;
    o.textContent = name;
    sc.appendChild(o);
  });
}

// A gridline lands on 1, 2 or 5 times a power of ten, so the labels read as numbers rather than as the quarters
// of whatever the largest measurement happens to be.
function niceStep(rough) {
  const power = 10 ** Math.floor(Math.log10(rough));
  const scaled = rough / power;
  return power * (scaled > 5 ? 10 : (scaled > 2 ? 5 : (scaled > 1 ? 2 : 1)));
}

// In the unit the axis is written in, not the one it is stored in: a round number of kibibytes is a ragged number
// of mebibytes, and time is read in seconds, minutes and hours rather than in powers of ten.
const CLOCK = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600];

function axisStep(metric, rough) {
  if (metric !== "peak_kib") {
    const seconds = rough / 1e6;
    if (seconds < 1) return niceStep(seconds) * 1e6;
    return (CLOCK.find(c => c >= seconds) ?? niceStep(seconds)) * 1e6;
  }
  return Math.max(1, niceStep(rough / 1024)) * 1024;
}

function drawSeries() {
  const svg = document.getElementById("series");
  clear(svg);
  const scope = document.getElementById("hist-scope").value;
  const metric = document.getElementById("hist-metric").value;
  const shown = seriesShown().filter(e => seriesValue(e, scope, metric) !== undefined);

  const values = shown.map(e => seriesValue(e, scope, metric));
  const write = metric === "peak_kib" ? size : (metric === "cpu_per_unit" ? unitDuration : duration);
  const top = Math.max(...values), low = Math.min(...values);

  // What a curve is read for is a regression, so the axis starts at zero: fitted to its own spread, a build that
  // never moved fills the panel with the noise of a shared runner. The spread is written out instead.
  const count = document.getElementById("hist-count");
  count.textContent = plural(shown.length, "measurement") +
                      (shown.length > 1 ? ` \u00b7 ${write(low)} to ${write(top)}` : "");
  if (shown.length < 2) return;

  const L = 74, sc = scale(top, axisStep(metric, top / 4));
  frame(svg, { left: L, scale: sc, write, from: shown[0].date.slice(0, 10),
               to: shown[shown.length - 1].date.slice(0, 10) });

  const x = i => L + (W - L - R) * i / (shown.length - 1);
  const y = v => yOf(v, sc.hi);

  const d = shown.map((e, i) => `${i ? "L" : "M"}${x(i)} ${y(values[i])}`).join(" ");
  svg.appendChild(el("path", { class: "line", d, fill: "none" }));

  shown.forEach((e, i) => {
    const picked = state.picked.includes(e.sha);
    const c = el("circle", { class: "dot", cx: x(i), cy: y(values[i]), r: picked ? 5.5 : 3.4 });
    attachTip(c, `<span class="mono">${esc(e.sha.slice(0, 7))}</span>${esc(e.date.slice(0, 10))} &middot; ${write(values[i])}`);
    c.style.cursor = "pointer";
    c.addEventListener("click", () => { pick(e); });
    svg.appendChild(c);
  });
}

// A first click reads that commit, a second compares it against the first: the two slots the page
// already has, filled from the branch rather than from a file someone downloaded.
function pick(entry, opening) {
  const help = document.getElementById("hist-help");
  fetch(seriesUrl(`${entry.sha}.csv`)).then(r => {
    if (!r.ok) throw new Error("gone");
    return r.text();
  }).then(text => {
    // Do not let the opening read overwrite a file dropped while it was in flight.
    if (opening && state.rows.length) return;
    const which = state.picked.length ? "base" : "now";
    state.picked = which === "now" ? [entry.sha] : state.picked.concat(entry.sha);
    help.textContent = state.picked.length === 1
      ? `Reading ${entry.sha.slice(0, 7)}. Click another point to compare it against this one.`
      : `Comparing ${state.picked[0].slice(0, 7)} against ${state.picked[1].slice(0, 7)}.`;
    apply(parse(text), which, entry.sha.slice(0, 7));
    if (opening) showTab("tab-hist");
  }).catch(() => {
    help.textContent = `The measurement of ${entry.sha.slice(0, 7)} is no longer on the branch.`;
  });
}

["hist-branch", "hist-scope", "hist-metric"].forEach(id => {
  document.getElementById(id).addEventListener("change", drawSeries);
});

// ---- loading -------------------------------------------------------------------------------
function load(file, which) {
  const reader = new FileReader();
  reader.onload = () => {
    const read = parse(String(reader.result));
    if (!read.rows.length && !read.links.length) {
      document.getElementById(`name-${which}`).textContent = "no -fproc-stat-report line in that file";
      return;
    }
    apply(read, which, file.name);
  };
  reader.readAsText(file);
}

["now", "base"].forEach(which => {
  const slot = document.getElementById(`slot-${which}`);
  const input = document.getElementById(`file-${which}`);
  input.addEventListener("change", () => {
    if (input.files?.[0]) load(input.files[0], which);
  });
  ["dragenter", "dragover"].forEach(e => {
    slot.addEventListener(e, ev => { ev.preventDefault(); slot.classList.add("over"); });
  });
  ["dragleave", "drop"].forEach(e => {
    slot.addEventListener(e, ev => { ev.preventDefault(); slot.classList.remove("over"); });
  });
  slot.addEventListener("drop", ev => {
    const f = ev.dataTransfer?.files?.[0];
    if (f) load(f, which);
  });
});

document.getElementById("q").addEventListener("input", e => {
  state.q = e.target.value;
  renderTable();
});
document.getElementById("mod").addEventListener("change", e => {
  state.mod = e.target.value;
  renderTable();
});

document.getElementById("csv").addEventListener("click", () => {
  const rows = visible();
  const head = `unit,module,peak_rss_kb,cpu_us${state.base ? ",baseline_rss_kb" : ""}\n`;
  const line = r => {
    const b = state.base ? `,${state.base[r.unit] ?? ""}` : "";
    return `${r.unit},${r.module},${r.rss},${r.cpu}${b}\n`;
  };
  const text = head + rows.map(line).join("");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/csv" }));
  a.download = "compile-cost-selection.csv";
  a.click();
  URL.revokeObjectURL(a.href);
});

// The theme toggle uses the class names doxygen-awesome uses, so a reader who has already picked
// a side in the documentation recognises the behaviour here.
let turns = 0;
document.getElementById("theme").addEventListener("click", () => {
  turns += 1;
  document.querySelector("#theme svg").style.transform = `rotate(${turns * 180}deg)`;
  const root = document.documentElement, dark = darkTheme();
  root.classList.remove("dark-mode", "light-mode");
  root.classList.add(dark ? "light-mode" : "dark-mode");
  if (state.rows.length) renderAll();
});


const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
function showTab(id) {
  tabs.forEach(tab => {
    const on = tab.id === id;
    tab.setAttribute("aria-selected", String(on));
    document.getElementById(tab.getAttribute("aria-controls")).hidden = !on;
  });
}
tabs.forEach(tab => {
  tab.addEventListener("click", () => { showTab(tab.id); });
});

// ---- saving a chart --------------------------------------------------------------------------
// The SVG is drawn with classes and theme variables, none of which survive a trip through an image.
// So a clone gets every visual property written down as an attribute, a background the colour of
// the page, and goes through a canvas three times the size it is drawn at.
const SAVE_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" ' +
                'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M4 19h16"/></svg>';
const INLINED = ["fill", "stroke", "stroke-width", "stroke-dasharray", "opacity",
               "font-family", "font-size", "font-weight"];

function inlineStyles(source, clone) {
  const from = [source, ...source.querySelectorAll("*")];
  const to = [clone, ...clone.querySelectorAll("*")];
  from.forEach((node, i) => {
    const cs = getComputedStyle(node);
    INLINED.forEach(prop => {
      const v = cs.getPropertyValue(prop);
      if (v && v !== "none" || prop === "fill") to[i].setAttribute(prop, v);
    });
    to[i].removeAttribute("class");
  });
}

function savePng(svg, name) {
  const vb = svg.viewBox.baseVal, w = vb.width, h = vb.height;
  const clone = svg.cloneNode(true);
  inlineStyles(svg, clone);
  clone.setAttribute("xmlns", SVGNS);
  clone.setAttribute("width", w);
  clone.setAttribute("height", h);
  const bg = el("rect", { x: vb.x, y: vb.y, width: w, height: h,
                        fill: getComputedStyle(document.body).backgroundColor });
  clone.insertBefore(bg, clone.firstChild);

  const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],
                                         { type: "image/svg+xml;charset=utf-8" }));
  const img = new Image();
  img.onload = () => {
    const scale = 3, canvas = document.createElement("canvas");
    canvas.width = w * scale;
    canvas.height = h * scale;
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    canvas.toBlob(blob => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${name}.png`;
      a.click();
      URL.revokeObjectURL(a.href);
    }, "image/png");
  };
  img.src = url;
}

// One export button per chart, written here rather than once per panel in the markup.
document.querySelectorAll(".panel.chart > svg").forEach(svg => {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "icon save";
  btn.title = "Save as PNG";
  btn.setAttribute("aria-label", "Save as PNG");
  btn.innerHTML = SAVE_ICON;
  btn.addEventListener("click", () => { savePng(svg, `compile-cost-${svg.id}`); });
  svg.parentNode.insertBefore(btn, svg.parentNode.firstChild);
});

// Dropping anywhere else must not navigate the browser away from the page.
["dragover", "drop"].forEach(e => {
  window.addEventListener(e, ev => { ev.preventDefault(); }, false);
});

// the tabs are wired above, and the series may switch to one as soon as it lands
loadSeries();
})();
