## Read by copacabana's matrix.yml: the linux jobs, one per row and configuration.
runs-on: ubuntu-latest
rows:
  - { name: "gcc"          , preset: "gcc"             , image: "v11" }
  - { name: "clang"        , preset: "clang"           , image: "v11" }
  - { name: "aarch64"      , preset: "gcc-aarch64"     , image: "v11" }
  - { name: "aarch64 sve"  , preset: "gcc-aarch64-sve" , image: "v11" }
  - { name: "aarch64 sve2" , preset: "gcc-aarch64-sve2", image: "v11" }
  - { name: "ppc64"        , preset: "gcc-ppc64"       , image: "v11" }
  - { name: "wasm"         , preset: "wasm"            , image: "v11" }
  - { name: "rvv128"       , preset: "rvv128"          , image: "v11" }
  - { name: "icpx"         , preset: "icpx"            , image: "sycl-v1", setup: "/opt/intel/oneapi/setvars.sh" }
  - { name: "icpx sycl"    , preset: "icpx-sycl"       , image: "sycl-v1", setup: "/opt/intel/oneapi/setvars.sh" }
