name: SPY Linux Tests
on:
  workflow_call:

jobs:
  linux:
    name: ${{ matrix.compiler.name }} (${{ matrix.options }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:${{ matrix.compiler.image }}
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: "gcc"          , preset: "gcc"             , image: "v10" }
          - { name: "clang"        , preset: "clang"           , image: "v10" }
          - { name: "aarch64"      , preset: "gcc-aarch64"     , image: "v10" }
          - { name: "aarch64 sve"  , preset: "gcc-aarch64-sve" , image: "v10" }
          - { name: "aarch64 sve2" , preset: "gcc-aarch64-sve2", image: "v10" }
          - { name: "ppc64"        , preset: "gcc-ppc64"       , image: "v10" }
          - { name: "wasm"         , preset: "wasm"            , image: "v9"  }
          - { name: "rvv128"       , preset: "rvv128"          , image: "v9"  }
          - { name: "icpx"         , preset: "icpx"            , image: "sycl-v1", setup: "/opt/intel/oneapi/setvars.sh" }
          - { name: "icpx sycl"    , preset: "icpx-sycl"       , image: "sycl-v1", setup: "/opt/intel/oneapi/setvars.sh" }

        options: [Debug, Release]

    steps:
      - name: Fetch current branch
        uses: actions/checkout@v6

      - name: Configure CMake and Build
        uses: ./.github/actions/config
        with:
          config: ${{ matrix.options }}
          preset: ${{ matrix.compiler.preset }}
          setup-script: ${{ matrix.compiler.setup }}

      - name: Run Unit Tests
        uses: ./.github/actions/test
        with:
          config: ${{ matrix.options }}
          preset: ${{ matrix.compiler.preset }}
