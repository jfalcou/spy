name: SPY Integration Tests
on:
  push:
    branches:
      - main

concurrency:
  group: spy-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    uses: jfalcou/copacabana/.github/workflows/integration.yml@main
    with:
      project: spy
      cxx-compiler: clang++
      cxx-flags: -std=c++20
      image: ghcr.io/jfalcou/compilers:v11

  ## The configure of a package manager: copacabana taken from the environment, CPM never called.
  external-dependencies:
    name: Dependencies from the environment
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/jfalcou/compilers:v11

    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      ## The pin of cmake/dependencies.cmake, so that this job and CPM read the same copacabana.
      - name: Fetch copacabana at its pin
        shell: bash
        run: |
          copa=$(sed -n 's/.*NAME COPACABANA.*GIT_TAG \([^ )]*\).*/\1/p' cmake/dependencies.cmake)
          test -n "$copa"
          git clone --quiet https://github.com/jfalcou/copacabana deps/copacabana
          git -C deps/copacabana checkout --quiet "$copa"

      ## No _deps directory afterwards: CPM ran nothing.
      - name: Configure with the dependencies from the environment
        shell: bash
        run: |
          cmake --preset clang -DSPY_EXTERNAL_DEPENDENCIES=ON -DCOPACABANA_SOURCE_DIR="$PWD/deps/copacabana"
          test ! -d build/clang/_deps

      - name: Build and run the unit tests
        shell: bash
        run: |
          cmake --build --preset clang --config Release
          ctest --preset clang --build-config Release -j 2 --output-on-failure --no-tests=error --timeout 300
