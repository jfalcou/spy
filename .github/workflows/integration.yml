name: SPY Integration Tests
on:
  push:
    branches:
      - main

concurrency:
  group: spy-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    uses: jfalcou/copacabana/.github/workflows/integration.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      project: spy
      cxx-compiler: clang++
      cxx-flags: -std=c++20
