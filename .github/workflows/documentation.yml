name: SPY Documentation Generation
on:
  push:
    branches:
      - main
  ## Builds nothing to deploy here: it reports what Doxygen said while generating the pages.
  pull_request:
    branches:
      - main

jobs:
  documentation:
    permissions:
      contents: write
    uses: jfalcou/copacabana/.github/workflows/documentation.yml@44053e713b1b57329ccbcbb8878c839024bf19ee # v8
    with:
      project: spy
      coverage: true
